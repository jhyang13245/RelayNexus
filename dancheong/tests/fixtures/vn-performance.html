<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>단청 연출 검증</title>
<link rel="stylesheet" href="/vn-runtime/vn.css"><link rel="stylesheet" href="/vn-runtime/vn-reader.css"><link rel="stylesheet" href="/vn-runtime/vn-cinema.css"><link rel="stylesheet" href="/cortex-vn-layout.css">
<style>body{margin:0;background:#080f14;color:#eee;font:16px system-ui}#controls{position:fixed;z-index:1000;bottom:0;left:0;right:0;padding:8px;background:#101d26ee;display:flex;gap:6px;flex-wrap:wrap}#controls[hidden]{display:none}button,input{font:inherit}input{width:150px}output{font:12px monospace;white-space:pre-wrap}#vn-stage{height:100dvh}#vn-visual{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 10%,#746c59,#17252c 55%,#080d12)}#qa-status{position:absolute;left:7%;bottom:15%;padding:8px;background:#101b23;font-size:12px;z-index:8}#vn-stage .vn-cutin{z-index:30}#qa-label{position:absolute;right:15px;top:15px;font:12px system-ui;color:#d7e1e9;z-index:9}</style>
<main id="vn-root"><section id="vn-stage" class="vn-stage is-nvl"><div id="vn-visual"></div><div id="vn-characters" class="vn-characters"><div id="slot-other" class="vn-character is-present" hidden><img id="other" class="vn-character-image is-visible" alt="오요한 기존 입상 178cm"></div><div id="slot-actor" class="vn-character is-present"><img id="actor" class="vn-character-image is-visible" alt="오요한 자세 변형 178cm"></div></div><div class="vn-play-area"><div id="vn-dialogue-box" class="vn-dialogue-box"><div id="vn-dialogue-text"></div></div></div><span id="qa-label">178cm · 기존 입상 / 자세 변형 비교</span><output id="qa-status">모듈 준비 중</output></section></main>
<div id="controls"><label>검증 키 <input id="qa-key" type="password" autocomplete="off"></label><button data-api="cast">판정 1회</button><button data-api="pose">자세 1장</button><button data-api="voice">음성 1회</button><button id="play">연출 재생</button><button id="emphasis">강조 재생</button><button id="duo">두 인물</button><button id="sound">효과음 비교</button><button id="listen">음성 재생</button><button id="clean">화면만 보기</button><output id="cost"></output></div>
<script type="module">
import{createCuePlayer}from'/cortex-vn-cue-player.mjs';import{createFoley}from'/cortex-vn-foley.mjs';import{createCinema}from'/vn-runtime/vn-cinema.mjs';import{typeset,renderTypeset}from'/vn-runtime/vn-typeset.mjs';import{displaySprite}from'/vn-runtime/vn-sprite.mjs';
import{stagePositions,slotWidth}from'/vn-runtime/vn-stage.mjs';import{projectStature}from'/vn-runtime/vn-stature.mjs';
const $=id=>document.getElementById(id),fixture=await(await fetch('/fixture')).json();let seq=0,timer,audio;
const cinema=createCinema({stage:$('vn-stage'),visual:$('vn-visual')});const foley=createFoley({createContext:()=>new AudioContext(),enabled:()=>true,speaking:()=>audio&&!audio.paused});
const events=[];const cue=createCuePlayer({fire:(c,input)=>{events.push(c.kind+':'+c.at);$('qa-status').textContent=events.join(' · ');if(c.sound!=='none')foley.play(c.sound,'test');if(c.kind==='impact')cinema.impact();if(c.kind==='emphasis'||c.kind==='cutin')cinema.update({pageKey:input.key,turnId:'test',direction:input.direction,fresh:true,enabled:true,cueReady:c.kind,portraits:[{id:'qa-priest',url:$('actor').src}],background:''});}});
$('actor').src=fixture.poseReady?await displaySprite('/result/pose.png','/result/pose.png','/reference.png'):await displaySprite('/reference.png');
function arrange(){const slots=[$('slot-other'),$('slot-actor')].filter(e=>!e.hidden),narrow=innerWidth<=760;const positions=stagePositions(slots.length,{narrow,compactLandscape:innerHeight<=600&&innerWidth>innerHeight});slots.forEach((slot,i)=>{const stature=projectStature(fixture.person,178);for(const [key,value]of Object.entries({x:positions[i],w:slotWidth(slots.length,narrow),hs:stature.scale,'stature-lift':stature.lift,'frame-scale':1,'frame-offset':'0%'}))slot.style.setProperty('--'+key,value);});}window.addEventListener('resize',arrange);arrange();$('qa-status').textContent='실제 런타임 준비 완료';
async function ledger(){const data=await(await fetch('/ledger')).json();$('cost').textContent=data.rows.map(r=>r.kind+': '+r.status+' $'+(r.cost?.usd?.toFixed(5)||'미확인')).join(' / ')+' | 한도 $2';}
for(const button of document.querySelectorAll('[data-api]'))button.onclick=async()=>{const key=$('qa-key').value;$('qa-key').value='';button.disabled=true;$('qa-status').textContent='검증 요청 중';const row=await(await fetch('/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,kind:button.dataset.api})})).json();$('qa-status').textContent=JSON.stringify(row);await ledger();if(row.status==='complete'&&row.kind==='pose'){$('actor').src=await displaySprite('/result/pose.png','/result/pose.png','/reference.png');$('qa-status').textContent='자세 생성 및 실제 보정 완료';}};
function play(important=false){clearInterval(timer);cinema.reset();cue.reset();events.length=0;foley.resume();const text=important?'그 순간, 모든 소리가 멎었다.':fixture.pages[0].text;const direction=important?{emphasis:{kind:'hold',text}}:{fx:'none',performance:{cues:[{anchor:'종이를 넘겼다.',kind:'sound',sound:'paper',when:'text'}],pauseMs:350}};const key='qa-'+(++seq);cue.update({key,text,direction,fresh:true,enabled:true});const layout=typeset(text,important?text:'');let count=0;$('qa-status').textContent='문장 재생 중';timer=setInterval(()=>{renderTypeset($('vn-dialogue-text'),layout,++count);cue.progress(count);if(count>=Array.from(text).length){clearInterval(timer);$('qa-status').textContent+=' · 완독';}},70);}
$('play').onclick=()=>play();$('emphasis').onclick=()=>play(true);$('duo').onclick=async()=>{$('other').src=await displaySprite('/reference.png');$('slot-other').hidden=!$('slot-other').hidden;arrange();};
$('sound').onclick=()=>{foley.resume();['paper','cloth','footstep','door','metal','impact'].forEach((name,i)=>setTimeout(()=>{foley.play(name);$('qa-status').textContent='효과음: '+name;},i*1000));};
$('listen').onclick=()=>{audio?.pause();audio=new Audio('/result/voice.mp3');audio.onended=()=>{$('qa-status').textContent='음성 재생 완료'};audio.play().catch(()=>{$('qa-status').textContent='음성 파일 없음'});};$('clean').onclick=()=>{$('controls').hidden=true;$('qa-status').hidden=true;};await ledger();play();
</script></html>
